spring.application.name=smart-document-backend

server.port=8080


# =========================
# PostgreSQL
# =========================

spring.datasource.url=jdbc:postgresql://localhost:5432/smart_document_db
spring.datasource.username=postgres
spring.datasource.password=123

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.sql.init.mode=never


# =========================
# Redis
# =========================

spring.data.redis.host=localhost
spring.data.redis.port=6379
spring.data.redis.database=0

management.health.redis.enabled=false


# =========================
# Spring AI
# =========================

spring.autoconfigure.exclude=org.springframework.ai.vectorstore.redis.autoconfigure.RedisVectorStoreAutoConfiguration


# =========================
# Spring Batch
# =========================

spring.batch.job.enabled=true


# =========================
# Security Logging
# =========================

logging.level.org.springframework.security=DEBUG